name: CI

# The merge gate of idp-workspace: formatting and vet, unit and contract tests (race detector on), the
# integration suite against a throwaway PostgreSQL (the Makefile starts it in Docker), the app bridge
# SDK (type check and tests), the offline image build, and the compose end-to-end of the image.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: vet, unit, contract, integration, bridge, image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Formatting, vet, unit and contract tests
        run: make test
      - name: Integration tests (PostgreSQL in Docker)
        run: make test-integration
      - name: App bridge SDK (type check, tests)
        run: |
          cd packages/bridge
          npm ci --ignore-scripts
          npm run typecheck
          npm test
      - name: Image build (static binary, docker build --network none)
        run: bash deploy/build.sh idp-workspace:ci
      - name: Compose end-to-end (workspace image + PostgreSQL)
        run: bash deploy/e2e.sh
