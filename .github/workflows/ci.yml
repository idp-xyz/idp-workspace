name: CI

# The merge gate of idp-workspace: formatting and vet, unit and contract tests (race detector on), the
# integration suite against a throwaway PostgreSQL (the Makefile starts it in Docker), the frontend
# (bridge SDK and web shell: type check and tests), and the compose end-to-end of the image with the
# web shell driven in a real Chromium. The joint run with idp-host (HOST=1) needs the idp-host images
# built from that repository and is not run here.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: vet, unit, contract, integration, frontend, image, browser
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Known vulnerabilities in the dependencies and the standard library (govulncheck)
        run: go install golang.org/x/vuln/cmd/govulncheck@latest && "$(go env GOPATH)/bin/govulncheck" ./...
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Formatting, vet, unit and contract tests
        run: make test
      - name: Integration tests (PostgreSQL in Docker)
        run: make test-integration
      - name: Frontend (bridge SDK and web shell)
        run: make test-web
      - name: Chromium for the browser smoke test
        run: npx playwright-core install --with-deps chromium
      - name: Compose end-to-end (image with the web shell + PostgreSQL, browser smoke)
        run: BROWSER=1 bash deploy/e2e.sh
