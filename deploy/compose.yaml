# idp-workspace development topology: the workspace image + PostgreSQL; with --profile host also the
# idp-host image, its worker and the HOST's deterministic model double, so an app action of kind
# host.run starts a real AgentRun and its result comes back into the inbox (ADR-0001 D4, D11, D12).
# Driven by deploy/e2e.sh, which generates the secrets in .local/compose.env, the workspace config in
# .local/workspace.yaml and the HOST config in .local/host.yaml. The host sees 127.0.0.1:8560 (API),
# 9566 (metrics) and, with the host profile, 8450 (HOST).
# With --profile oidc also Keycloak (the realm comes from deploy/keycloak/realm.py): the shell signs
# in there, the workspace and the HOST verify its tokens, and the workspace exchanges a member's token
# for the HOST's audience (ADR-0001 D14, D16). The issuer is the URL the browser uses
# (http://127.0.0.1:7080/realms/idp); containers reach it as keycloak:7080.
# DEV ONLY: development tokens or a test realm, plaintext http on the private networks.
name: idp-workspace-go

x-hardened: &hardened
  read_only: true
  cap_drop: [ALL]
  security_opt: ['no-new-privileges:true']

networks:
  edge: {}
  upstream: {internal: true}   # workspace -> host, host -> fakemodel
  data: {internal: true}

volumes:
  pgdata: {}

services:
  postgres:
    image: ${IDP_PG_IMAGE:-public.ecr.aws/docker/library/postgres:17-alpine}
    networks: [data]
    environment:
      POSTGRES_PASSWORD: ${IDP_PG_OWNER_PASSWORD:?run deploy/e2e.sh}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U postgres']
      interval: 2s
      timeout: 3s
      retries: 30

  workspace-admin:
    <<: *hardened
    image: ${IDP_WORKSPACE_IMAGE:-idp-workspace:dev}
    profiles: [tools]
    networks: [data]
    environment:
      IDP_MIGRATION_DATABASE_URL: postgres://postgres:${IDP_PG_OWNER_PASSWORD:?run deploy/e2e.sh}@postgres:5432/idp_workspace?sslmode=disable
      IDP_APP_DB_PASSWORD: ${IDP_APP_DB_PASSWORD:?run deploy/e2e.sh}
      IDP_DEV_MODE: 'true'
      IDP_DEV_SECRET: ${IDP_DEV_SECRET:?run deploy/e2e.sh}
    depends_on: {postgres: {condition: service_healthy}}

  workspace:
    <<: *hardened
    image: ${IDP_WORKSPACE_IMAGE:-idp-workspace:dev}
    command: [serve]
    networks: [edge, upstream, data]
    ports: ['127.0.0.1:8560:8560', '127.0.0.1:9566:9566']
    environment:
      IDP_DATABASE_URL: postgres://idp_ws_svc:${IDP_APP_DB_PASSWORD:?run deploy/e2e.sh}@postgres:5432/idp_workspace?sslmode=disable
      IDP_WORKSPACE_LISTEN: 0.0.0.0:8560
      IDP_WORKSPACE_CONFIG: /etc/idp/workspace.yaml
      IDP_DEV_MODE: 'true'
      IDP_DEV_SECRET: ${IDP_DEV_SECRET:?run deploy/e2e.sh}
      IDP_METRICS_LISTEN: 0.0.0.0:9566
      IDP_WORKSPACE_PUBLIC_URL: http://127.0.0.1:8560
      # OIDC=1 sets these (Keycloak); empty = development tokens
      IDP_WORKSPACE_JWKS_URL: ${IDP_WORKSPACE_JWKS_URL:-}
      IDP_WORKSPACE_ISSUER: ${IDP_WORKSPACE_ISSUER:-idp-workspace-dev}
      IDP_WORKSPACE_OIDC_CLIENT_ID: ${IDP_WORKSPACE_OIDC_CLIENT_ID:-}
      IDP_WORKSPACE_SUBJECT_CLAIM: ${IDP_WORKSPACE_SUBJECT_CLAIM:-sub}
    volumes: ['../.local/workspace.yaml:/etc/idp/workspace.yaml:ro', '../.local/host.key:/etc/idp/host.key:ro', '../.local/exchange.secret:/etc/idp/exchange.secret:ro']
    depends_on: {postgres: {condition: service_healthy}}

  keycloak:
    image: ${IDP_KEYCLOAK_IMAGE:-quay.io/keycloak/keycloak:26.8.1}
    profiles: [oidc]
    command: [start-dev, --import-realm, --features, 'token-exchange-standard']
    networks: [edge, upstream]
    ports: ['127.0.0.1:7080:7080']
    environment:
      KC_HTTP_PORT: '7080'
      KC_HOSTNAME: http://127.0.0.1:7080
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: 'true'
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:?run deploy/e2e.sh}
    volumes: ['../.local/keycloak:/opt/keycloak/data/import:ro']
    healthcheck:
      test: ['CMD', 'bash', '-c', 'exec 3<>/dev/tcp/127.0.0.1/7080']
      interval: 3s
      timeout: 3s
      retries: 80

  # ---- the HOST (profile host): images built in the idp-host repository ----
  fakemodel:
    <<: *hardened
    image: ${IDP_FAKEMODEL_IMAGE:-idp-host-fakemodel:dev}
    profiles: [host]
    networks: [upstream]
    environment:
      IDP_FAKEMODEL_LISTEN: 0.0.0.0:18080

  host-admin:
    <<: *hardened
    image: ${IDP_HOST_IMAGE:-idp-host:dev}
    profiles: [host-tools]
    networks: [data]
    environment:
      IDP_MIGRATION_DATABASE_URL: postgres://postgres:${IDP_PG_OWNER_PASSWORD:?run deploy/e2e.sh}@postgres:5432/idp_host?sslmode=disable
      IDP_APP_DB_PASSWORD: ${IDP_HOST_DB_PASSWORD:?run deploy/e2e.sh}
      IDP_DEV_MODE: 'true'
      IDP_DEV_SECRET: ${IDP_HOST_DEV_SECRET:?run deploy/e2e.sh}
    depends_on: {postgres: {condition: service_healthy}}

  host:
    <<: *hardened
    image: ${IDP_HOST_IMAGE:-idp-host:dev}
    command: [serve]
    profiles: [host]
    networks: [edge, upstream, data]
    ports: ['127.0.0.1:8450:8450']
    environment:
      IDP_DATABASE_URL: postgres://idp_host_svc:${IDP_HOST_DB_PASSWORD:?run deploy/e2e.sh}@postgres:5432/idp_host?sslmode=disable
      IDP_HOST_LISTEN: 0.0.0.0:8450
      IDP_DEV_MODE: 'true'
      IDP_DEV_SECRET: ${IDP_HOST_DEV_SECRET:?run deploy/e2e.sh}
      IDP_HOST_JWKS_URL: ${IDP_HOST_JWKS_URL:-}
      IDP_HOST_ISSUER: ${IDP_HOST_ISSUER:-idp-host-dev}
      IDP_HOST_CREDENTIAL_KEY: ${IDP_HOST_CREDENTIAL_KEY:?run deploy/e2e.sh}
      IDP_HOST_CONFIG: /etc/idp/host.yaml
      IDP_HOST_WORKERS: '0'
    volumes: ['../.local/host.yaml:/etc/idp/host.yaml:ro']
    depends_on: [fakemodel]

  host-worker:
    <<: *hardened
    image: ${IDP_HOST_IMAGE:-idp-host:dev}
    command: [worker]
    profiles: [host]
    networks: [upstream, data]
    environment:
      IDP_DATABASE_URL: postgres://idp_host_svc:${IDP_HOST_DB_PASSWORD:?run deploy/e2e.sh}@postgres:5432/idp_host?sslmode=disable
      IDP_DEV_MODE: 'true'
      IDP_HOST_CREDENTIAL_KEY: ${IDP_HOST_CREDENTIAL_KEY:?run deploy/e2e.sh}
      IDP_HOST_CONFIG: /etc/idp/host.yaml
      IDP_HOST_WORKERS: '2'
    volumes: ['../.local/host.yaml:/etc/idp/host.yaml:ro']
    depends_on: [fakemodel]
