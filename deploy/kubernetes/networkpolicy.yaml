# Default deny, then exactly what the Workspace needs. PostgreSQL is in the databases namespace; the
# IdP and the apps' webhook backends are outside the cluster here (ipBlock placeholders).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: idp-workspace
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  namespace: idp-workspace
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
---
# workspace: ingress on the API port from the ingress controller (the shell and members) and from
# idp-eer (the inbox producer, EER ADR-038), metrics from the monitoring namespace; egress to
# PostgreSQL, the IdP (JWKS, token exchange), idp-host (runs), idp-cmi (a member's memory), idp-eer (approval decisions) and the
# apps' webhook backends.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: workspace
  namespace: idp-workspace
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: workspace
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: idp-eer
      ports:
        - {protocol: TCP, port: 8560}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
      ports:
        - {protocol: TCP, port: 9566}
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: databases
          podSelector:
            matchLabels:
              app.kubernetes.io/name: postgresql
      ports:
        - {protocol: TCP, port: 5432}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: idp-host
      ports:
        - {protocol: TCP, port: 8450}
    - to:   # idp-cmi: a member's own memory ("my memory", D21; the member's token exchanged for the CMI audience)
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: idp-cmi
      ports:
        - {protocol: TCP, port: 8550}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: idp-eer
      ports:
        - {protocol: TCP, port: 8080}
    - to:
        - ipBlock:
            cidr: 203.0.113.10/32       # the IdP (JWKS, token exchange)
      ports:
        - {protocol: TCP, port: 443}
    - to:
        - ipBlock:
            cidr: 203.0.113.30/32       # apps' webhook backends
      ports:
        - {protocol: TCP, port: 443}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
      ports:
        - {protocol: TCP, port: 4318}   # OTLP/HTTP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: migrate
  namespace: idp-workspace
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: migrate
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: databases
          podSelector:
            matchLabels:
              app.kubernetes.io/name: postgresql
      ports:
        - {protocol: TCP, port: 5432}
