# The Secrets the manifests reference, with placeholder values. NOT part of kustomization.yaml:
# create them with your secret management (External Secrets, Sealed Secrets, cert-manager, ...).
# tests/deploy checks that every secretKeyRef / secret volume in the manifests names a Secret and
# key listed here.
apiVersion: v1
kind: Secret
metadata:
  name: idp-workspace-db
  namespace: idp-workspace
stringData:
  owner-url: postgres://idp_ws_owner:CHANGE-ME@postgres.databases.svc.cluster.local:5432/idp_workspace?sslmode=verify-full
  service-url: postgres://idp_ws_svc:CHANGE-ME@postgres.databases.svc.cluster.local:5432/idp_workspace?sslmode=verify-full
---
apiVersion: v1
kind: Secret
metadata:
  name: idp-workspace-tls             # server certificate of the Workspace API (cert-manager Certificate recommended)
  namespace: idp-workspace
type: kubernetes.io/tls
stringData:
  tls.crt: "-----BEGIN CERTIFICATE-----\nCHANGE-ME\n-----END CERTIFICATE-----"
  tls.key: "-----BEGIN PRIVATE KEY-----\nCHANGE-ME\n-----END PRIVATE KEY-----"
---
apiVersion: v1
kind: Secret
metadata:
  name: idp-workspace-identity-ca     # CA of the IdP, if not publicly trusted
  namespace: idp-workspace
stringData:
  ca.crt: "-----BEGIN CERTIFICATE-----\nCHANGE-ME\n-----END CERTIFICATE-----"
---
apiVersion: v1
kind: Secret
metadata:
  name: idp-workspace-service-ca      # CA of the HOST's and EER's server certificates (optional)
  namespace: idp-workspace
stringData:
  ca.crt: "-----BEGIN CERTIFICATE-----\nCHANGE-ME\n-----END CERTIFICATE-----"
---
apiVersion: v1
kind: Secret
metadata:
  name: idp-workspace-signing-key     # P-256 key signing app tokens (ADR-0001 D15): openssl genpkey -algorithm EC -pkeyopt ec_paramgen_curve:P-256
  namespace: idp-workspace
stringData:
  signing.pem: "-----BEGIN PRIVATE KEY-----\nCHANGE-ME\n-----END PRIVATE KEY-----"
---
apiVersion: v1
kind: Secret
metadata:
  name: idp-workspace-exchange        # the Workspace's client secret at the IdP (token exchange, D16)
  namespace: idp-workspace
stringData:
  client-secret: CHANGE-ME
---
apiVersion: v1
kind: Secret
metadata:
  name: idp-workspace-webhook         # signs webhook calls to apps' backends (D4), at least 32 bytes
  namespace: idp-workspace
stringData:
  secret: CHANGE-ME-TO-AT-LEAST-32-RANDOM-BYTES
