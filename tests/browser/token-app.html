<!doctype html>
<html>
<head><meta charset="utf-8"><title>Desk</title></head>
<body>
<h1>Desk</h1>
<pre id="token"></pre>
<script>
// An app that asks the shell for a token for its own backend (identity.token, ADR-0001 D15).
const shell = 'http://127.0.0.1:8560';
window.addEventListener('message', (ev) => {
  if (ev.origin !== shell || ev.source !== window.parent) return;
  const m = ev.data;
  if (m && m.type === 'response' && m.id === 't1') document.getElementById('token').textContent = m.result ? m.result.token : 'ERROR ' + m.error.code;
});
parent.postMessage({ protocol: 'idp.bridge/v1', type: 'request', id: 't1', method: 'identity.token' }, shell);
</script>
</body>
</html>
